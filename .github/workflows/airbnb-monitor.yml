# Her 20 dakikada bir tarama — bilgisayarın kapalı olsa da çalışır.
# Gerekli: GitHub repo + Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)

name: Airbnb Barcelona Monitor

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Prepare directories
        run: mkdir -p data logs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore listings database
        uses: actions/cache/restore@v4
        with:
          path: data/listings.db
          key: airbnb-barcelona-listings-db
          restore-keys: |
            airbnb-barcelona-listings-db
            airbnb-barcelona-listings-db-

      - name: Install Python deps and Chromium
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run one monitor cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
          LOG_LEVEL: INFO
        run: python -m src.main --once

      - name: Refresh listings database cache
        if: ${{ success() && github.event_name != 'pull_request' && hashFiles('data/listings.db') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete airbnb-barcelona-listings-db --repo "${{ github.repository }}" || true

      - name: Save listings database
        if: ${{ success() && github.event_name != 'pull_request' && hashFiles('data/listings.db') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/listings.db
          key: airbnb-barcelona-listings-db
