trip:
  destination: "Barcelona, Spain"
  destinations:
    - "Barcelona, Spain"
    - "Badalona, Spain"
  checkin: "2026-06-16"
  checkout: "2026-06-22"
  guests: 3
  max_total_price_eur: 900

polling:
  interval_minutes: 20
  max_pages_per_run: 5

scraper:
  headless: true
  browser_timeout_ms: 60000
  scrape_delay_seconds: 2
  detail_price_verify_margin_eur: 25
  max_detail_price_verifications: 8
  detail_price_base_url: "https://www.airbnb.com.tr"
  detail_price_wait_ms: 6500

scoring:
  weights:
    distance: 0.30
    price: 0.30
    review: 0.15
    cancellation: 0.15
    entire_home: 0.10
  min_review_score: 4.5
  rare_deal_percentile: 15

filters:
  require_entire_home: false
  require_free_cancellation: false
  require_superhost: false
  require_self_check_in: false
  max_distance_km: 8.0

debug:
  tracked_listing_urls:
    - "https://www.airbnb.com.tr/rooms/887692388841951937"
  tracked_listing_ids: []

center:
  name: "Barceloneta plajı"
  lat: 41.3788
  lng: 2.1894

preferred_neighborhoods:
  - Eixample
  - Gothic Quarter
  - El Born
  - Gràcia
  - Sant Antoni
  - Barri Gòtic
  - El Raval
  - Poble Sec
  - Barceloneta

notifications:
  min_score_to_notify: 55
  notify_on_price_drop: true
  notify_on_new_listing: true
  notify_on_rare_deal: true
